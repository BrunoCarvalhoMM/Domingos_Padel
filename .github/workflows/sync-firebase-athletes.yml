name: Sincronizar atletas Firebase com GitHub

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-base:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.ATHLETES_SYNC_TOKEN }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Copiar atletas do Firebase para o index.html
        run: python .github/scripts/sync_firebase_athletes.py
        env:
          FIREBASE_DATABASE_URL: https://padel-domingos-default-rtdb.europe-west1.firebasedatabase.app/base_atletas.json

      - name: Guardar a lista atualizada no GitHub
        run: |
          if git diff --quiet -- index.html; then
            echo "A lista já está atualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualiza base de atletas a partir do Firebase"
          git push origin HEAD:main
